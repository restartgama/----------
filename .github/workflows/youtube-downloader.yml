name: Build YouTube Downloader
on:
  push:
    branches: [youtube-downloader]
    paths:
      - 'YouTube_Downloader/**'
      - '.github/workflows/youtube-downloader.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: YouTube_Downloader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install build dependencies
        run: python -m pip install --pre "yt-dlp[default]" yt-dlp-ejs pyinstaller imageio-ffmpeg
      - name: Test
        run: python -m unittest test_app.py
      - name: Build Windows app
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --console --name YouTubeDownloader --collect-all yt_dlp --collect-all yt_dlp_ejs app.py
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          New-Item -ItemType Directory -Force dist/YouTubeDownloader/tools | Out-Null
          python -c "import imageio_ffmpeg,shutil; shutil.copy2(imageio_ffmpeg.get_ffmpeg_exe(), 'dist/YouTubeDownloader/tools/ffmpeg.exe')"
          Copy-Item (Get-Command node.exe).Source dist/YouTubeDownloader/tools/node.exe
          Copy-Item README.txt dist/YouTubeDownloader/README.txt
          Compress-Archive -Path dist/YouTubeDownloader -DestinationPath YouTubeDownloader-Windows.zip
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "youtube-downloader-${{ github.run_number }}"
          gh release create $tag YouTubeDownloader-Windows.zip --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "YouTube Downloader Windows" --notes "Windows용 다운로드 프로그램입니다. ZIP을 압축 해제한 후 YouTubeDownloader.exe를 실행하세요. tools와 _internal 폴더를 함께 보관하세요. 본인 콘텐츠 또는 다운로드 권한이 있는 영상에 사용하세요."
