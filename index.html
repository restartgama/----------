<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>절대 열지 마세요 🎁</title>
<meta property="og:title" content="🎁 절대 열지 마세요">
<meta property="og:description" content="친구가 보낸 수상한 선물입니다. 눌러서 열어보세요.">
<meta property="og:image" content="https://raw.githack.com/restartgama/----------/main/cover.svg">
<meta property="og:type" content="website">
<meta property="og:url" content="https://raw.githack.com/restartgama/----------/main/index.html">
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(circle at 50% 30%,#fff8d8,#ffd9e5 40%,#b9ddff);color:#26222b}main{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}.card{width:min(92vw,430px);padding:30px 22px;border-radius:32px;background:#ffffffd9;box-shadow:0 20px 70px #7c5b8d33}h1{font-size:28px;margin:0 0 8px}.sub{color:#6e6672}.gift{font-size:125px;cursor:pointer;user-select:none;filter:drop-shadow(0 12px 10px #0002)}.shake{animation:shake .5s}@keyframes shake{25%{transform:rotate(-10deg) scale(1.05)}75%{transform:rotate(10deg) scale(1.05)}}.cloud{display:none;font-size:120px;animation:pop .65s cubic-bezier(.2,1.7,.4,1)}@keyframes pop{from{transform:scale(.1);opacity:0}}.msg{display:none;font-size:26px;font-weight:800}.hint{font-size:14px;color:#817986;margin-top:18px}.spark{position:fixed;pointer-events:none;font-size:27px;animation:fly 1.1s ease-out forwards}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(360deg) scale(.2);opacity:0}}button{display:none;margin:22px auto 0;border:0;border-radius:999px;padding:14px 22px;font-weight:800;font-size:16px;background:#222;color:white}</style></head><body><main><section class="card"><h1 id="title">🎁 절대 누르지 마세요</h1><p class="sub" id="sub">친구가 보낸 수상한 선물입니다.</p><div class="gift" id="gift">🎁</div><div class="cloud" id="cloud">☁️</div><div class="msg" id="msg">안녕! 오늘도 좋은 하루 ☀️</div><div class="hint" id="hint">상자를 3번 터치하면…</div><button id="again">다시 해보기</button></section></main><script>let n=0;const g=document.querySelector('#gift'),c=document.querySelector('#cloud'),h=document.querySelector('#hint'),m=document.querySelector('#msg'),a=document.querySelector('#again');g.onclick=()=>{n++;g.classList.remove('shake');void g.offsetWidth;g.classList.add('shake');h.textContent=n<3?'앞으로 '+(3-n)+'번!':'';if(n===3){g.style.display='none';c.style.display='block';m.style.display='block';a.style.display='block';title.textContent='✨ 짜잔!';sub.textContent='터치해서 열어버렸네요.';for(let i=0;i<45;i++){let s=document.createElement('span');s.className='spark';s.textContent=['✨','⭐','💖','🎉','🌈'][Math.floor(Math.random()*5)];s.style.left='50vw';s.style.top='48vh';s.style.setProperty('--x',(Math.random()*700-350)+'px');s.style.setProperty('--y',(Math.random()*700-400)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1200)}}};a.onclick=()=>location.reload()</script></body></html>
